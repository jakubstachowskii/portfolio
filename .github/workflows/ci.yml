name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · typy · testy · build · e2e · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

      - run: pnpm build
        env:
          # token tylko dla kroków budujących stronę (sekcja GitHub wymaga GraphQL z tokenem);
          # instalacja zależności, lint i testy jednostkowe go nie widzą
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Na razie tylko ostrzeżenie; blokada w Fazie 9 (PLAN §14)
      - name: Szukaj TODO(content) w dist/
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rl "TODO(content)" dist/; then
            echo "::warning::W buildzie są jeszcze TODO(content)"
          fi

      - name: Zainstaluj Chromium dla Playwrighta
        run: pnpm exec playwright install --with-deps chromium

      # brakujące baseline’y snapshotów są tworzone, nie oblewane — commituje je update-snapshots.yml (DECISIONS #19)
      - run: pnpm test:e2e --update-snapshots=missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: pnpm lhci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
