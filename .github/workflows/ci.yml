name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · typy · testy · build · e2e · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Na razie tylko ostrzeżenie; blokada w Fazie 9 (PLAN §14)
      - name: Szukaj TODO(content) w dist/
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rl "TODO(content)" dist/; then
            echo "::warning::W buildzie są jeszcze TODO(content)"
          fi

      - name: Zainstaluj Chromium dla Playwrighta
        run: pnpm exec playwright install --with-deps chromium

      # brakujące baseline’y snapshotów są tworzone, nie oblewane — commituje je update-snapshots.yml (DECISIONS #19)
      - run: pnpm test:e2e --update-snapshots=missing

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
