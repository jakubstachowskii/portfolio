name: Aktualizuj snapshoty Playwrighta

# Ręcznie: Actions → „Aktualizuj snapshoty Playwrighta” → Run workflow → wybierz gałąź.
# Generuje baseline’y visual testów na Linuksie (jak w CI) i commituje je na wybraną gałąź.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wygeneruj snapshoty
        run: pnpm exec playwright test --grep "visual snapshot" --update-snapshots

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          if git diff --cached --quiet; then
            echo "Brak zmian w snapshotach"
          else
            git commit -m "test: aktualizacja snapshotów playwrighta (linux)"
            git push
          fi
