name: Aktualizuj snapshoty Playwrighta

# Ręcznie: Actions → „Aktualizuj snapshoty Playwrighta” → Run workflow → wybierz gałąź.
# Generuje baseline’y visual testów na Linuksie (jak w CI) i commituje je na wybraną gałąź.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          # token nie zostaje w .git/config, gdy działają instalacja i testy wybranej gałęzi
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wygeneruj snapshoty
        run: pnpm exec playwright test --grep "visual snapshot" --update-snapshots

      - name: Commit
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          if git diff --cached --quiet; then
            echo "Brak zmian w snapshotach"
          else
            git commit -m "test: aktualizacja snapshotów playwrighta (linux)"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi
