<!doctype html>
<!--
  Szkice kierunków A/B/C (Faza 1a). NIE jest to kod produkcyjny — tylko materiał do decyzji.
  Użycie: kierunki.html?d=a|b|c&t=light|dark
  Treść: tylko placeholdery TODO(content) i przykłady z docs/PLAN.md.
-->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Szkice kierunków</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300..600&display=swap&subset=latin-ext"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        font-family: var(--sans);
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .todo {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .shot {
        background: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 9px);
        display: grid;
        place-items: center;
      }

      /* ───────── A · Notatnik warsztatowy (inspiracja: Convex) ───────── */
      [data-d='a'] {
        --sans: 'Geist', sans-serif;
        --mono: 'JetBrains Mono', monospace;
        --bg: #eef1f3;
        --card: #ffffff;
        --fg: #1b1f24;
        --muted: #56606a;
        --line: #cfd6dc;
        --dot: #c3ccd4;
        --marker: #f2d649;
        --link: #1f4b99;
        --hatch: #dfe4e8;
        --code: #1b1f24;
        --codefg: #e8e6e1;
      }
      [data-d='a'][data-t='dark'] {
        --bg: #1a1d21;
        --card: #22262b;
        --fg: #e8e6e1;
        --muted: #a3a9b0;
        --line: #343a41;
        --dot: #2c3137;
        --link: #9cb8ee;
        --hatch: #2a2f35;
        --code: #121417;
      }
      [data-d='a'] body {
        background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
        background-size: 20px 20px;
      }
      .a-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
        font-size: 14px;
      }
      .a-nav nav {
        display: flex;
        gap: 24px;
      }
      .a-kbd {
        font-family: var(--mono);
        font-size: 12px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 2px 6px;
        background: var(--card);
      }
      .a-hero {
        display: grid;
        grid-template-columns: 5fr 7fr;
        gap: 48px;
        padding: 64px 0 80px;
        border-left: 1px solid var(--line);
        margin-left: -1px;
        padding-left: 32px;
      }
      .a-term {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 28px;
      }
      .a-term b {
        font-weight: 500;
        color: var(--fg);
      }
      .a-hero h1 {
        font-weight: 500;
        font-size: 60px;
        line-height: 1.02;
        letter-spacing: -0.035em;
      }
      .a-lead {
        margin-top: 24px;
        font-size: 19px;
        line-height: 1.55;
        max-width: 30ch;
      }
      .a-lead mark {
        background: linear-gradient(transparent 55%, var(--marker) 55% 92%, transparent 92%);
        color: inherit;
      }
      .a-cta {
        display: flex;
        gap: 12px;
        margin-top: 36px;
      }
      .a-btn {
        font-size: 15px;
        padding: 11px 18px;
        border-radius: 6px;
        text-decoration: none;
        border: 1px solid var(--fg);
      }
      .a-btn.p {
        background: var(--fg);
        color: var(--bg);
      }
      .a-fig {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
      }
      .a-fig .shot {
        height: 300px;
        border-radius: 3px;
      }
      .a-fig figcaption {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        padding: 12px 4px 2px;
      }
      .a-fig h3 {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
        padding: 4px 4px 0;
      }
      .a-fig p {
        padding: 6px 4px 4px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      .a-tags {
        display: flex;
        gap: 6px;
        padding: 10px 4px 4px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .a-tags span {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 7px;
      }

      /* ───────── B · Instrukcja techniczna / cyjanotypia (inspiracja: Zed) ───────── */
      [data-d='b'] {
        --sans: 'Geist', sans-serif;
        --serif: 'Source Serif 4', serif;
        --mono: 'Geist Mono', monospace;
        --bg: #fcfcfd;
        --fg: #16181d;
        --muted: #5b6270;
        --line: #e3e8ef;
        --grid: #eef1f6;
        --accent: #b4232c;
        --hatch: #e9edf3;
      }
      [data-d='b'][data-t='dark'] {
        --bg: #0e2a47;
        --fg: #eaf2fb;
        --muted: #a9c1da;
        --line: rgba(234, 242, 251, 0.22);
        --grid: rgba(234, 242, 251, 0.07);
        --accent: #ffb4a8;
        --hatch: rgba(234, 242, 251, 0.12);
      }
      [data-d='b'] body {
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .b-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .b-nav nav {
        display: flex;
        gap: 22px;
        align-items: center;
      }
      .b-key {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 1px 5px;
        margin-left: 6px;
        color: var(--muted);
      }
      .b-body {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 56px;
        padding-top: 56px;
      }
      .b-toc {
        font-size: 13px;
        line-height: 2.1;
        color: var(--muted);
        border-right: 1px solid var(--line);
        padding-right: 24px;
      }
      .b-toc a {
        text-decoration: none;
        display: block;
      }
      .b-toc a[aria-current] {
        color: var(--fg);
        box-shadow: inset 2px 0 var(--accent);
        padding-left: 10px;
        margin-left: -12px;
      }
      .b-hero h1 {
        font-family: var(--serif);
        font-weight: 300;
        font-size: 64px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        max-width: 14ch;
      }
      .b-lead {
        font-family: var(--serif);
        font-size: 21px;
        line-height: 1.6;
        margin-top: 22px;
        max-width: 36ch;
        color: var(--fg);
      }
      .b-term {
        font-family: var(--mono);
        font-size: 13px;
        margin-top: 22px;
        color: var(--muted);
      }
      .b-term::before {
        content: '§ ';
        color: var(--accent);
      }
      .b-cta {
        display: flex;
        gap: 10px;
        margin-top: 32px;
      }
      .b-btn {
        font-size: 14px;
        padding: 9px 14px;
        border-radius: 2px;
        border: 1px solid var(--fg);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      .b-btn.p {
        background: var(--fg);
        color: var(--bg);
      }
      .b-btn.p .b-key {
        border-color: currentColor;
        color: inherit;
        opacity: 0.7;
      }
      .b-spec {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        border: 1px solid var(--line);
        margin-top: 64px;
        background: var(--bg);
      }
      .b-spec .shot {
        min-height: 250px;
        border-right: 1px solid var(--line);
      }
      .b-spec .meta {
        padding: 22px 24px;
      }
      .b-spec h3 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      .b-spec p {
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
        margin-top: 8px;
      }
      .b-spec dl {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 8px 12px;
        margin-top: 18px;
        font-size: 13px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .b-spec dt {
        color: var(--muted);
      }
      .b-spec dd {
        font-family: var(--mono);
        font-size: 12.5px;
      }

      /* ───────── C · Stół świetlny / bursztyn (inspiracja: Dovetail) ───────── */
      [data-d='c'] {
        --sans: 'Geist', sans-serif;
        --mono: 'IBM Plex Mono', monospace;
        --bg: #101416;
        --card: #161b1e;
        --fg: #e9edef;
        --muted: #9aa5ac;
        --line: #232b30;
        --grid: #1a2125;
        --amber: #f5b23d;
        --amberText: #f5b23d;
        --onAmber: #101416;
        --hatch: #1f272b;
        --glow: rgba(245, 178, 61, 0.1);
      }
      [data-d='c'][data-t='light'] {
        --bg: #f7f8f8;
        --card: #ffffff;
        --fg: #111619;
        --muted: #56616a;
        --line: #dde2e5;
        --grid: #e8ecee;
        --amber: #b77900;
        --amberText: #8a5a00;
        --onAmber: #111619;
        --hatch: #e6eaec;
        --glow: rgba(183, 121, 0, 0.08);
      }
      [data-d='c'] body {
        background-image:
          radial-gradient(600px circle at 72% 30%, var(--glow), transparent 60%),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size:
          auto,
          48px 48px,
          48px 48px;
      }
      .c-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
        font-size: 14px;
      }
      .c-nav nav {
        display: flex;
        gap: 6px;
      }
      .c-nav nav a {
        text-decoration: none;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
      }
      .c-status {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .c-status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--amber);
        display: inline-block;
      }
      .c-hero {
        padding: 88px 0 56px;
        max-width: 820px;
      }
      .c-hero h1 {
        font-weight: 500;
        font-size: 72px;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .c-lead {
        margin-top: 24px;
        font-size: 19px;
        line-height: 1.55;
        color: var(--muted);
        max-width: 42ch;
      }
      .c-term {
        margin-top: 28px;
        font-family: var(--mono);
        font-size: 14px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        display: inline-block;
      }
      .c-term span {
        color: var(--amberText);
      }
      .c-term u {
        text-decoration: none;
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--amber);
        vertical-align: -2px;
        margin-left: 2px;
      }
      .c-cta {
        display: flex;
        gap: 10px;
        margin-top: 28px;
      }
      .c-btn {
        font-size: 15px;
        padding: 11px 18px;
        border-radius: 6px;
        text-decoration: none;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .c-btn.p {
        background: var(--amber);
        color: var(--onAmber);
        border-color: var(--amber);
        font-weight: 500;
      }
      .c-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .c-cell {
        background: var(--card);
      }
      .c-cell .shot {
        height: 240px;
      }
      .c-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .c-side {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .c-side h3 {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .c-side p {
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <script>
      const p = new URLSearchParams(location.search);
      document.documentElement.dataset.d = p.get('d') || 'a';
      document.documentElement.dataset.t = p.get('t') || 'light';
    </script>

    <!-- A -->
    <template id="a">
      <div class="wrap">
        <header class="a-nav">
          <strong>TODO(content): monogram</strong>
          <nav><a>Projekty</a><a>O mnie</a><a>Kontakt</a><span class="a-kbd">Ctrl K</span></nav>
        </header>
        <section class="a-hero">
          <div>
            <p class="a-term">&gt; building: <b>kalkulator-mebli v2</b></p>

            <p class="a-lead">
              Buduję dopracowane narzędzia, które <mark>automatyzują prawdziwą pracę</mark> — od
              desktopu po web.
            </p>

              przykładowe zdanie z PLAN §5.1 — finalne od właściciela
            </p>
            <div class="a-cta">
              <a class="a-btn p">Zobacz projekty</a><a class="a-btn">Pobierz CV</a>

          </div>
          <figure class="a-fig">
            <div class="shot"><span class="todo">TODO(content): zrzut ekranu</span></div>
            <figcaption><span>Rys. 1 · web, single-page</span><span>live</span></figcaption>
            <h3>Kalkulator mebli</h3>

            <div class="a-tags"><span>TODO(content): stack</span></div>
          </figure>

      </div>

    <!-- B -->
    <template id="b">
      <div class="wrap">
        <header class="b-nav">
          <strong>TODO(content): monogram</strong>
          <nav>
            <a>Projekty</a><a>O mnie</a><a>Kontakt</a
            ><span>Szukaj<span class="b-key">Ctrl K</span></span>
          </nav>
        </header>
        <div class="b-body">
          <aside class="b-toc" aria-label="Spis treści">
            <a aria-current="true">Wstęp</a><a>Projekty</a><a>Co robię</a><a>Stack</a><a>Kontakt</a>
          </aside>
          <main>
            <section class="b-hero">
              <h1>TODO(content): Imię Nazwisko</h1>
              <p class="b-lead">
                Buduję dopracowane narzędzia, które automatyzują prawdziwą pracę — od desktopu po
                web.
              </p>
              <p class="b-term">teraz: kalkulator-mebli v2</p>
              <div class="b-cta">
                <a class="b-btn p">Zobacz projekty<span class="b-key">P</span></a
                ><a class="b-btn">Pobierz CV<span class="b-key">C</span></a>
              </div>
            </section>
            <article class="b-spec">
              <div class="shot"><span class="todo">TODO(content): zrzut ekranu</span></div>
              <div class="meta">
                <h3>Kalkulator mebli</h3>
                <p>Rozkrój mebli, rysunek, lista rozkroju i PDF dla stolarni.</p>
                <dl>
                  <dt>Typ</dt>
                  <dd>web, single-page</dd>

                  <dd>TODO(content)</dd>

                  <dd>TODO(content)</dd>

              </div>

        </div>
      </div>
    </template>

    <!-- C -->
    <template id="c">
      <div class="wrap">
        <header class="c-nav">
          <strong>TODO(content): monogram</strong>
          <nav><a>Projekty</a><a>O mnie</a><a>Kontakt</a><a>Ctrl K</a></nav>
          <span class="c-status"><i></i>Otwarty na oferty · TODO(content)</span>
        </header>
        <section class="c-hero">
          <h1>TODO(content): Imię Nazwisko</h1>
          <p class="c-lead">
            Buduję dopracowane narzędzia, które automatyzują prawdziwą pracę — od desktopu po web.
          </p>
          <p class="c-term">$ <span>building</span> kalkulator-mebli v2<u></u></p>
          <div class="c-cta">
            <a class="c-btn p">Zobacz projekty</a><a class="c-btn">Pobierz CV</a>
          </div>

        <div class="c-grid">
          <div class="c-cell">
            <div class="shot"><span class="todo">TODO(content): zrzut ekranu</span></div>
            <div class="c-row"><span>web · single-page</span><span>live</span></div>
          </div>

    <script>
      const t = document.getElementById(document.documentElement.dataset.d);
      document.body.appendChild(t.content.cloneNode(true));

</html>
